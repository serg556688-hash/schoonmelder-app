<script>
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (root && !root.dataset.appLoaded) {
      root.innerHTML =
        '<div style="padding:24px;font-family:sans-serif;color:#D9432B;font-size:13px;line-height:1.5;">' +
        '<b>Не удалось загрузить приложение.</b><br/>Проверь подключение к интернету и открой файл ещё раз.<br/><br/>' +
        'Техническая причина: ' + (e.message || 'неизвестная ошибка') +
        '</div>';
    }
  });
</script>

function compressImage(file, maxWidth = 480, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 8000 }
    );
  });
}

const VEHICLE_SPEED_KMH = { foot: 5, bike: 15, ebike: 20, scooter: 25, car: 30 };
const GEO_VERIFY_THRESHOLD_M = 150;

function haversineKm(a, b) {
  if (!a || !b) return null;
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function estimateMinutes(km, vehicleId) {
  const speed = VEHICLE_SPEED_KMH[vehicleId] || 5;
  return Math.max(1, Math.round((km / speed) * 60));
}

        try { localStorage.setItem('schoonmelder:pendingRole:' + email.trim().toLowerCase(), signupRole); } catch (e) {}

function App() {
  const [lang, setLangState] = useState(() => {
    try { return localStorage.getItem('schoonmelder:lang') || 'ru'; } catch (e) { return 'ru'; }
  });
  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem('schoonmelder:lang', l); } catch (e) {}
  };
  const t = makeT(lang);
  const [tab, setTab] = useState('main');
  const [reports, setReports] = useState([]);
  const [loading, setLoading] = useState(true);
  const [dbError, setDbError] = useState(false);
  const [withdrawOpen, setWithdrawOpen] = useState(false);
  const [langMenuOpen, setLangMenuOpen] = useState(false);

  const [session, setSession] = useState(undefined); // undefined = checking, null = signed out
  const [profileRow, setProfileRow] = useState(null);
  const [authBusy, setAuthBusy] = useState(true);

  useEffect(() => {
    let mounted = true;
    db.auth.getSession().then(({ data }) => { if (mounted) setSession(data.session || null); });
    const { data: sub } = db.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => { mounted = false; sub.subscription.unsubscribe(); };
  }, []);

  const loadProfile = useCallback(async (uid) => {
    try {
      const { data } = await db.from('profiles').select('*').eq('id', uid).maybeSingle();
      setProfileRow(data || null);
    } catch (e) {
      setProfileRow(null);
    }
    setAuthBusy(false);
  }, []);

  useEffect(() => {
    if (session === undefined) return;
    if (session === null) { setProfileRow(null); setAuthBusy(false); return; }
    setAuthBusy(true);
    loadProfile(session.user.id);
  }, [session, loadProfile]);

  const role = profileRow ? profileRow.role : 'reporter';
  const profile = profileRow ? rowToProfile(profileRow) : { name: '', phone: '', vehicle: 'foot', withdrawnCents: 0 };

  const saveProfile = useCallback(async (patch) => {
    setProfileRow((p) => (p ? { ...p, ...profilePatchToRow(patch) } : p));
    if (!session) return;
    try { await db.from('profiles').update(profilePatchToRow(patch)).eq('id', session.user.id); } catch (e) {}
  }, [session]);

  const signOut = useCallback(async () => { await db.auth.signOut(); }, []);

  const loadReports = useCallback(async () => {
    try {
      const { data, error } = await db.from('reports').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      setReports(data.map(rowToReport));
      setDbError(false);
    } catch (e) {
      setDbError(true);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    loadReports();
    const id = setInterval(loadReports, 4000);
    return () => clearInterval(id);
  }, [loadReports]);

  // Add a brand-new report: optimistic local update + insert into Supabase.
  const addReport = useCallback(async (report) => {
    setReports((prev) => [report, ...prev]);
    try {
      const { error } = await db.from('reports').insert(reportToInsertRow(report));
      if (error) throw error;
      setDbError(false);
    } catch (e) {
      setDbError(true);
    }
  }, []);

  // Patch one existing report by id: optimistic local update + update in Supabase.
  const patchReport = useCallback(async (id, patch, dbPatch) => {
    setReports((prev) => prev.map((r) => (r.id === id ? { ...r, ...patch } : r)));
    try {
      const { error } = await db.from('reports').update(dbPatch).eq('id', id);
      if (error) throw error;
      setDbError(false);
    } catch (e) {
      setDbError(true);
    }
  }, []);

  useEffect(() => { setTab('main'); }, [role]);

  const totalPhotosSent = reports.reduce((sum, r) => sum + (r.photos?.length || (r.photo ? 1 : 0)), 0);
  const earnedCents = role === 'reporter'
    ? totalPhotosSent * REPORTER_CENT_REWARD

function ReporterMain({ t, reports, addReport, patchReport, balanceCents, setTab }) {
  const [photos, setPhotos] = useState([]);
  const [comment, setComment] = useState('');
  const [coords, setCoords] = useState(null);
  const [locating, setLocating] = useState(false);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  const active = reports.filter((r) => r.status !== STATUS.CONFIRMED);
  const [photoError, setPhotoError] = useState('');
  const [justSent, setJustSent] = useState(false);

  const addPhoto = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setPhotoError('');
    if (!coords && !locating) {
      setLocating(true);
      getLocation().then((loc) => { setCoords(loc); setLocating(false); });
    }
    try {
      const dataUrl = await compressImage(file);
      setPhotos((p) => [...p, dataUrl].slice(0, 3));
    } catch (err) {
      setPhotoError(t('photoErrorText'));
    }
    if (fileRef.current) fileRef.current.value = '';
  };

  const removePhoto = (i) => setPhotos((p) => p.filter((_, idx) => idx !== i));

  const submit = async () => {
    if (photos.length === 0) return;
    setBusy(true);
    const report = { id: uid(), photos, coords, comment: comment.trim(), createdAt: Date.now(), status: STATUS.NEW };
    await addReport(report);
    setPhotos([]); setComment(''); setCoords(null); setBusy(false);
    setJustSent(true);
    setTimeout(() => setJustSent(false), 3000);
  };

  const confirmDone = async (id) => {
    await patchReport(id, { status: STATUS.CONFIRMED, confirmedAt: Date.now() }, { status: STATUS.CONFIRMED });
  };

  return (
    <div style={s.viewCol}>
      <button style={s.balanceCard} onClick={() => setTab('bonus')}>
        <div>
          <div style={s.balanceLabel}>{t('balanceBonusLabel')}</div>
          <div style={s.balanceAmount}>{formatEuro(balanceCents)}</div>
        </div>
        <Icon name="Wallet" size={22} color={COLORS.accent} />
      </button>

      {justSent && (
        <div style={s.successBanner}><Icon name="Check" size={15} style={{ marginRight: 6 }} /> {t('sentBanner')}</div>
      )}

      <div style={s.card}>
        <div style={s.cardTitle}>{t('reportFormTitle')}</div>

        <div style={s.photoGrid}>
          {photos.map((p, i) => (
            <div key={i} style={s.photoThumbWrap}>
              <img src={p} style={s.photoThumb} alt="" />
              <button style={s.photoRemove} onClick={() => removePhoto(i)}><Icon name="X" size={11} color="#fff" /></button>
            </div>
          ))}
          {photos.length < 3 && (
            <label style={s.photoAdd}>
              <Icon name="Plus" size={18} color={COLORS.accent} />
              <input ref={fileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={addPhoto} />
            </label>
          )}
        </div>
        {photoError && <div style={s.errorText}>{photoError}</div>}

        <div style={s.mapBox}>
          <Icon name="MapPin" size={16} color={COLORS.accent} />
          <span style={s.metaText}>{locating ? t('locating') : coords ? `${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}` : t('locationPending')}</span>
        </div>

        <div style={s.cardTitle2}>{t('commentLabel')}</div>

        <textarea
          placeholder={t('commentPlaceholder')}
          value={comment}
          onChange={(e) => setComment(e.target.value)}
          style={s.textarea}
          rows={3}
        />

        <button style={{ ...s.primaryBtn, width: '100%', marginTop: 10, ...((busy || photos.length === 0) ? s.btnDisabled : {}) }} onClick={submit} disabled={busy || photos.length === 0}>
          {busy ? t('submitBtnBusy') : t('submitBtn')}
        </button>
        {photos.length === 0 && <div style={s.hint}>{t('needPhotoHint')}</div>}
      </div>

      <div style={s.sectionLabel}>{t('activeTitle')} ({active.length})</div>
      {active.length === 0 && <div style={s.emptyState}>{t('noActive')}</div>}
      {active.map((r) => (
        <ReportCard t={t} key={r.id} report={r}>
          {r.status === STATUS.AWAITING_CONFIRM && (
            <button style={{ ...s.primaryBtn, width: '100%', marginTop: 10 }} onClick={() => confirmDone(r.id)}>
              <Icon name="Check" size={15} style={{ marginRight: 6 }} /> {t('confirmDoneBtn')}
            </button>
          )}
        </ReportCard>
      ))}
    </div>
  );
}

function ExecutorMain({ t, reports, patchReport, profile, saveProfile, balanceCents, setTab }) {
  const open = reports.filter((r) => r.status === STATUS.NEW || r.status === STATUS.IN_PROGRESS);
  const [jobStep, setJobStep] = useState({}); // { [id]: 'route' | 'onsite' }
  const [myLoc, setMyLoc] = useState(null);
  const [locating, setLocating] = useState(false);
  const watchIdsRef = useRef({});
  const lastSentRef = useRef({});

  useEffect(() => {
    // Resume "route" step locally for any job this session already marked in_progress,
    // so a page refresh doesn't strand the executor mid-job.
    reports.forEach((r) => {
      if (r.status === STATUS.IN_PROGRESS && !jobStep[r.id] && !watchIdsRef.current[r.id]) {
        setJobStep((m) => ({ ...m, [r.id]: 'route' }));
      }
    });
    // eslint-disable-next-line
  }, [reports]);

  const startWatching = (id) => {
    if (!navigator.geolocation || watchIdsRef.current[id]) return;
    const watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        setMyLoc({ lat, lng });
        const now = Date.now();
        if (!lastSentRef.current[id] || now - lastSentRef.current[id] > 6000) {
          lastSentRef.current[id] = now;
          patchReport(
            id,
            { executorCoords: { lat, lng }, executorUpdatedAt: now },
            { executor_lat: lat, executor_lng: lng, executor_updated_at: now }
          );
        }
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 5000 }
    );
    watchIdsRef.current[id] = watchId;
  };

  const stopWatching = (id) => {
    if (watchIdsRef.current[id] != null && navigator.geolocation) {
      navigator.geolocation.clearWatch(watchIdsRef.current[id]);
      delete watchIdsRef.current[id];
    }
  };

  useEffect(() => () => {
    Object.values(watchIdsRef.current).forEach((wid) => navigator.geolocation && navigator.geolocation.clearWatch(wid));
  }, []);

  const acceptJob = async (id) => {
    setJobStep((m) => ({ ...m, [id]: 'route' }));
    await patchReport(id, { status: STATUS.IN_PROGRESS }, { status: STATUS.IN_PROGRESS });
    if (!myLoc && !locating) {
      setLocating(true);
      const loc = await getLocation();
      setMyLoc(loc);
      setLocating(false);
    }
    startWatching(id);
  };

  const openNav = (coords) => {
    if (!coords) return;
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${coords.lat},${coords.lng}`, '_blank');
  };

  const onCompletionPhoto = async (e, id) => {
    const file = e.target.files?.[0];
    if (!file) return;
    stopWatching(id);
    const [dataUrl, completionCoords] = await Promise.all([compressImage(file), getLocation()]);
    const completedAt = Date.now();
    await patchReport(
      id,
      { status: STATUS.AWAITING_CONFIRM, completionPhoto: dataUrl, completionCoords, completedAt },
      {
        status: STATUS.AWAITING_CONFIRM,
        completion_photo: dataUrl,
        completion_lat: completionCoords ? completionCoords.lat : null,
        completion_lng: completionCoords ? completionCoords.lng : null,
        completed_at: completedAt,
      }
    );
    setJobStep((m) => { const n = { ...m }; delete n[id]; return n; });
  };

  return (
    <div style={s.viewCol}>
      <button style={s.balanceCard} onClick={() => setTab('earnings')}>
        <div>
          <div style={s.balanceLabel}>{t('balanceIncomeLabel')}</div>
          <div style={s.balanceAmount}>{formatEuro(balanceCents)}</div>
        </div>
        <Icon name="Wallet" size={22} color={COLORS.accent} />
      </button>

      <div style={s.card}>
        <div style={s.cardTitle2}>{t('vehicleTitle')}</div>
        <div style={s.vehicleRow}>
          {VEHICLES.map(({ id, labelKey, icon: iconName }) => (
            <button key={id} style={{ ...s.vehicleBtn, ...(profile.vehicle === id ? s.vehicleBtnActive : {}) }} onClick={() => saveProfile({ vehicle: id })}>
              <Icon name={iconName} size={17} color={profile.vehicle === id ? COLORS.accent : COLORS.muted} />
              <span style={{ fontSize: 9.5, color: profile.vehicle === id ? COLORS.accent : COLORS.muted, marginTop: 3 }}>{t(labelKey)}</span>
            </button>
          ))}
        </div>
      </div>

      <div style={s.sectionLabel}>{t('newJobsTitle')} ({open.length})</div>
      {open.length === 0 && <div style={s.emptyState}>{t('noNewJobs')}</div>}
      {open.map((r) => {
        const step = jobStep[r.id];
        return (
          <ReportCard t={t} key={r.id} report={r} priceCents={EXECUTOR_CENT_REWARD}>
            {!step && (
              <button style={{ ...s.primaryBtn, width: '100%', marginTop: 10 }} onClick={() => acceptJob(r.id)}>{t('acceptJobBtn')}</button>
            )}
            {step === 'route' && (
              <RouteView
                t={t}
                from={myLoc}
                to={r.coords}
                locating={locating}
                vehicle={profile.vehicle}
                onNavigate={() => openNav(r.coords)}
                onArrived={() => setJobStep((m) => ({ ...m, [r.id]: 'onsite' }))}
              />
            )}
            {step === 'onsite' && (
              <label style={{ ...s.primaryBtn, width: '100%', marginTop: 10, textAlign: 'center' }}>
                <Icon name="ImagePlus" size={14} style={{ marginRight: 6 }} /> {t('imDoneBtn')}
                <input type="file" accept="image/*" style={{ display: 'none' }} onChange={(e) => onCompletionPhoto(e, r.id)} />
              </label>
            )}
          </ReportCard>
        );
      })}
    </div>
  );
}

function RouteView({ t, from, to, locating, vehicle, onNavigate, onArrived }) {
  const km = haversineKm(from, to);
  const mins = km != null ? estimateMinutes(km, vehicle) : null;

  return (
    <div style={{ marginTop: 10 }}>
      <RouteMap />

function LiveTrackingBlock({ t, report }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  const km = (report.coords && report.executorCoords) ? haversineKm(report.coords, report.executorCoords) : null;
  const secondsAgo = report.executorUpdatedAt != null ? Math.max(0, Math.round((now - report.executorUpdatedAt) / 1000)) : null;

  return (
    <div style={{ marginTop: 10 }}>
      <div style={s.liveBadgeRow}>
        <span style={s.pulseDot} />
        <span style={s.liveLabel}>{t('executorEnRoute')}</span>
      </div>
      <div style={{ position: 'relative' }}>
        <RouteMap />
        <span style={s.mapPulseDot} />
      </div>
      <div style={s.routeStatsRow}>
        <div>
          <div style={s.routeStatValue}>{km != null ? `${km.toFixed(1)} km` : '—'}</div>
          <div style={s.metaText}>{t('distanceLabel')}</div>
        </div>
        <div>
          <div style={s.routeStatValue}>{secondsAgo != null ? `${secondsAgo}s` : '—'}</div>
          <div style={s.metaText}>{t('updatedAgoLabel')}</div>
        </div>
      </div>
    </div>
  );
}

  const items = role === 'reporter'

    <div style={s.viewCol}>

function ChatView({ t, role }) {
  const otherName = role === 'reporter' ? t('roleExecutor') : t('roleReporter');
  const [messages, setMessages] = useState([
    { id: 'm1', from: 'other', text: role === 'reporter' ? t('chatHelloReporter') : t('chatHelloExecutor'), ts: Date.now() },
  ]);
  const [input, setInput] = useState('');
  const scrollRef = useRef(null);
  useEffect(() => { scrollRef.current?.scrollTo(0, scrollRef.current.scrollHeight); }, [messages]);

  const send = () => {
    const text = input.trim();
    if (!text) return;
    setMessages((m) => [...m, { id: uid(), from: 'me', text, ts: Date.now() }]);
    setInput('');
    setTimeout(() => setMessages((m) => [...m, { id: uid(), from: 'other', text: t('chatAutoReply'), ts: Date.now() }]), 900);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: 440 }}>
      <div style={s.chatHeader}>{otherName}</div>
      <div ref={scrollRef} style={s.chatScroll}>
        {messages.map((m) => (
          <div key={m.id} style={{ ...s.chatBubbleRow, justifyContent: m.from === 'me' ? 'flex-end' : 'flex-start' }}>
            <div style={{ ...s.chatBubble, ...(m.from === 'me' ? s.chatBubbleMine : s.chatBubbleOther) }}>{m.text}</div>
          </div>
        ))}
      </div>
      <div style={s.chatInputRow}>
        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder={t('chatPlaceholder')} style={s.chatInput} />
        <button style={s.chatSendBtn} onClick={send}><Icon name="Send" size={16} color="#fff" /></button>
      </div>
    </div>
  );
}

function ReportCard({ t, report, children, priceCents }) {
  const meta = STATUS_META[report.status];
  const [compare, setCompare] = useState(50);
  const photos = report.photos || (report.photo ? [report.photo] : []);
  const hasBoth = photos[0] && report.completionPhoto;

  let geoBadge = null;
  if (hasBoth) {
    if (report.coords && report.completionCoords) {
      const meters = haversineKm(report.coords, report.completionCoords) * 1000;
      const ok = meters <= GEO_VERIFY_THRESHOLD_M;
      geoBadge = (
        <div style={{ ...s.geoBadge, color: ok ? COLORS.success : '#D9432B', background: ok ? COLORS.successSoft : '#FBE0DB' }}>
          {ok ? <Icon name="ShieldCheck" size={13} /> : <Icon name="ShieldAlert" size={13} />}
          <span>{ok ? t('geoVerified').replace('{n}', meters.toFixed(0)) : t('geoMismatch').replace('{n}', (meters / 1000).toFixed(1))}</span>
        </div>
      );
    } else {
      geoBadge = (
        <div style={{ ...s.geoBadge, color: COLORS.muted, background: COLORS.border }}>
          <Icon name="ShieldAlert" size={13} />
          <span>{t('geoUnavailable')}</span>
        </div>
      );
    }
  }

  return (
    <div style={s.card}>
      <div style={s.badgeRow}>
        <span style={{ ...s.badge, color: meta.color, background: meta.bg }}>{t(meta.labelKey)}</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {priceCents != null && <span style={s.priceTag}>{formatEuro(priceCents)}</span>}
          <span style={s.metaText}><Icon name="Clock" size={12} style={{ verticalAlign: -2, marginRight: 4 }} />{formatTime(report.createdAt)}</span>
        </div>
      </div>

      {hasBoth ? (
        <div>
          <div style={s.compareBox}>
            <img src={report.completionPhoto} alt={t("afterLabel")} style={s.compareImgFull} />
            <div style={{ ...s.compareImgClip, clipPath: `inset(0 ${100 - compare}% 0 0)` }}>
              <img src={photos[0]} alt={t("beforeLabel")} style={s.compareImgFull} />
            </div>
            <span style={{ ...s.compareTag, left: 8 }}>{t('beforeLabel')}</span>
            <span style={{ ...s.compareTag, right: 8 }}>{t('afterLabel')}</span>
          </div>
          <input type="range" min={0} max={100} value={compare} onChange={(e) => setCompare(+e.target.value)} style={s.slider} />
          {geoBadge}
        </div>
      ) : (
        <div style={{ display: 'flex', gap: 6 }}>
          {photos.map((p, i) => <img key={i} src={p} alt="" style={{ ...s.previewImg, maxHeight: 140, flex: 1 }} />)}
        </div>
      )}

      {report.status === STATUS.IN_PROGRESS && (
        <LiveTrackingBlock t={t} report={report} />
      )}

      {report.comment && <div style={s.metaRow}><Icon name="MessageSquare" size={13} color={COLORS.muted} /><span style={s.metaText}>{report.comment}</span></div>}
      {report.coords && <div style={s.metaRow}><Icon name="MapPin" size={13} color={COLORS.muted} /><span style={s.metaText}>{report.coords.lat.toFixed(5)}, {report.coords.lng.toFixed(5)}</span></div>}
      {children}
    </div>
  );
}
