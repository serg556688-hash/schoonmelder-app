.scene3d { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.scene3d canvas { display: block; }
.auth-layout { position: relative; z-index: 1; }
.page { min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; background: radial-gradient(circle at 15% 0%, #fff0e1 0, transparent 45%), radial-gradient(circle at 100% 100%, #ffe8d3 0, transparent 40%), #fffaf5; font-family: Arial, Helvetica, sans-serif; color: #26252a; letter-spacing: .015em; }
.page * { box-sizing: border-box; }
.page button, .page input, .page select { font: inherit; }
.page button { cursor: pointer; }
.auth-layout { width: min(100%, 720px); }
.auth-card { position: relative; padding: 0 64px 52px; border: 1px solid #f4c9a1; border-radius: 64px; background: rgba(255,255,255,.93); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 2px 0 #f7dcc2, 0 30px 70px rgba(233, 117, 16, .16), 0 8px 20px rgba(42,30,24,.05); overflow: visible; transform-style: preserve-3d; transition: transform .25s ease-out; will-change: transform; }
.brand img { animation: sm-float 6s ease-in-out infinite; }
@keyframes sm-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .brand img { animation: none; } }
.top-accent { position: absolute; top: 14px; left: 50%; width: 190px; height: 30px; transform: translateX(-50%); border-radius: 0 0 25px 25px; background: linear-gradient(105deg, #e9740e, #f5a45d 55%, #e97912); }
.language-control { position: absolute; top: 60px; right: 46px; z-index: 3; }
[dir="rtl"] .language-control { right: auto; left: 46px; }
.language-button { display: grid; place-items: center; width: 56px; height: 56px; padding: 14px; border: 0; border-radius: 50%; color: #fff; background: radial-gradient(circle at 35% 30%, #f8b06a, #ea7915 60%, #d0640a); box-shadow: 0 4px 0 #b9560a, 0 8px 16px rgba(184, 89, 18, .3), inset 0 1px 0 rgba(255,255,255,.5); }
.language-button svg { width: 100%; height: 100%; }
.lang-overlay { position: fixed; inset: 0; z-index: 1; }
.language-menu { position: absolute; top: 64px; right: 0; z-index: 2; min-width: 160px; padding: 6px; border: 1px solid #f1e0d0; border-radius: 14px; background: #fff; box-shadow: 0 10px 28px rgba(42, 30, 24, .14); }
[dir="rtl"] .language-menu { right: auto; left: 0; }
.language-menu button { display: block; width: 100%; padding: 11px 12px; border: 0; border-radius: 9px; background: transparent; text-align: start; font-size: 16px; color: #26252a; }
.language-menu button:hover { background: #fff1e3; }
.language-menu button.active { background: #ffe3cf; font-weight: 700; }
.brand { display: flex; align-items: center; justify-content: center; padding: 118px 0 34px; }
.brand img { display: block; width: min(100%, 540px); height: auto; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 30px 34px; }
.tab { min-height: 62px; border: 1px solid #f3e5d8; border-radius: 17px; color: #5e5b5c; background: #fffaf5; font-size: 21px; font-weight: 600; }
.tab.active, .submit-button { border-color: transparent; color: #fff; background: linear-gradient(180deg, #f6a050 0%, #ef8423 45%, #e46f0c 100%); box-shadow: 0 5px 0 #c25a07, 0 10px 22px rgba(190, 91, 18, .28), inset 0 1px 0 rgba(255,255,255,.45); text-shadow: 0 1px 0 rgba(150,60,0,.25); transition: transform .08s, box-shadow .08s; }
.tab.active:active, .submit-button:active { transform: translateY(4px); box-shadow: 0 1px 0 #c25a07, 0 4px 10px rgba(190,91,18,.25), inset 0 1px 0 rgba(255,255,255,.4); }
.tab:not(.active) { box-shadow: 0 4px 0 #f0dfcf; }
.auth-form { display: flex; flex-direction: column; gap: 16px; }
.auth-form input, .auth-form select { width: 100%; height: 68px; padding: 0 21px; border: 1px solid #ecdccf; border-radius: 18px; outline: none; color: #29272a; background: #fffefc; font-size: 20px; appearance: none; -webkit-appearance: none; box-shadow: inset 0 3px 6px rgba(120,70,30,.07), 0 1px 0 #fff; transition: box-shadow .2s, transform .2s; }
.auth-form input:focus, .auth-form select:focus { box-shadow: inset 0 2px 4px rgba(120,70,30,.06), 0 0 0 4px rgba(234,121,21,.14); }
.auth-form select { background-image: linear-gradient(45deg, transparent 50%, #e97510 50%), linear-gradient(135deg, #e97510 50%, transparent 50%); background-position: calc(100% - 28px) 50%, calc(100% - 21px) 50%; background-size: 7px 7px; background-repeat: no-repeat; }
[dir="rtl"] .auth-form select { background-position: 21px 50%, 28px 50%; }
.auth-form select.empty { color: #858180; }
.auth-form input::placeholder { color: #858180; opacity: 1; }
.auth-form input:focus, .auth-form select:focus { border: 2px solid #ea7915; padding: 0 20px; }
.submit-button { width: 100%; min-height: 66px; border: 0; border-radius: 17px; font-size: 22px; font-weight: 700; }
.submit-button:disabled { opacity: .6; cursor: wait; }
.link-button { align-self: center; border: 0; background: none; color: #c8620c; font-size: 16px; padding: 4px 8px; text-decoration: underline; text-underline-offset: 3px; }
.form-title, .check-email h2 { margin: 0 0 4px; text-align: center; font-size: 26px; color: #26252a; }
.check-email { text-align: center; }
.check-email p { color: #6c6866; font-size: 18px; line-height: 1.5; margin: 8px 0 24px; }
.divider-label { margin: 26px 0 18px; color: #797574; font-size: 17px; text-align: center; }
.social-buttons { display: flex; flex-direction: column; gap: 14px; }
.social-buttons button { display: flex; justify-content: center; align-items: center; gap: 16px; width: 100%; min-height: 66px; border: 1px solid #ecdccf; border-radius: 18px; color: #252329; background: linear-gradient(180deg, #ffffff, #fff8f1); font-size: 20px; font-weight: 600; box-shadow: 0 4px 0 #efdccb, 0 8px 18px rgba(42,30,24,.06); transition: transform .08s, box-shadow .08s; }
.social-buttons button:active { transform: translateY(3px); box-shadow: 0 1px 0 #efdccb, 0 3px 8px rgba(42,30,24,.06); }
.social-buttons svg { width: 26px; height: 26px; flex: none; }
.social-buttons button:hover, .tab:not(.active):hover { background: #fff2e5; }
.submit-button:hover, .tab.active:hover, .language-button:hover { filter: brightness(.96); }
.page button:focus-visible { outline: 3px solid #333; outline-offset: 3px; }
.status-message { margin: 14px 0 0; text-align: center; font-size: 16px; line-height: 1.45; }
.status-message.error { color: #c0391b; }
.status-message.ok { color: #2f8a57; }
.role-note { max-width: 650px; margin: 18px auto 0; text-align: center; color: #787473; font-size: 17px; line-height: 1.55; }
@media (max-width: 700px) {
  .page { align-items: flex-start; padding: 16px 12px 28px; }
  .auth-card { padding: 0 22px 32px; border-radius: 40px; }
  .top-accent { width: 140px; height: 22px; top: 10px; }
  .language-control { top: 40px; right: 22px; }
  [dir="rtl"] .language-control { left: 22px; }
  .language-button { width: 44px; height: 44px; padding: 10px; }
  .language-menu { top: 52px; }
  .brand { padding: 92px 0 22px; }
  .tabs { gap: 8px; margin: 0 0 22px; }
  .tab { min-height: 52px; font-size: 16px; border-radius: 13px; }
  .auth-form { gap: 12px; }
  .auth-form input, .auth-form select { height: 56px; font-size: 16px; border-radius: 13px; }
  .submit-button { min-height: 56px; font-size: 17px; border-radius: 13px; }
  .divider-label { margin: 20px 0 14px; font-size: 15px; }
  .social-buttons { gap: 10px; }
  .social-buttons button { min-height: 54px; font-size: 15px; gap: 10px; border-radius: 13px; }
  .social-buttons svg { width: 21px; height: 21px; }
  .role-note { font-size: 14px; margin-top: 14px; }
  .form-title, .check-email h2 { font-size: 21px; }
  .check-email p { font-size: 15px; }
}
